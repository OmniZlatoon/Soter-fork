name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soter
          POSTGRES_PASSWORD: soter
          POSTGRES_DB: soter_test
        options: >-
          --health-cmd "pg_isready -U soter -d soter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable corepack and activate pnpm@9
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm -v
        shell: bash

      - name: Install dependencies (frozen lockfile)
        env:
          CI: true
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Run Prisma migrations
        working-directory: app/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://soter:soter@127.0.0.1:5432/soter_test

      - name: Lint
        run: pnpm --filter backend run lint

      - name: Test
        run: pnpm --filter backend run test
        env:
          DATABASE_URL: postgresql://soter:soter@127.0.0.1:5432/soter_test

      - name: Build
        run: pnpm --filter backend run build
